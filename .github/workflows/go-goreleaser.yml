name: Go GoReleaser
'on':
  workflow_call:
    inputs:
      go-version-file:
        description: Module file relative to repository root; empty resolves working-directory/go.mod
        required: false
        default: ''
        type: string
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      goreleaser-version:
        description: Pinned GoReleaser binary version
        required: false
        default: v2.18.2
        type: string
      args:
        description: GoReleaser release args; use snapshot input for nonpublishing validation
        required: false
        default: release --clean
        type: string
      working-directory:
        description: Directory containing .goreleaser.yml
        required: false
        default: .
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 30
        type: number
      tap-owner:
        description: Owner of the Homebrew tap repository
        required: false
        default: matt-riley
        type: string
      tap-repo:
        description: Homebrew tap repository; Homebrew publish is skipped when no tap token is available
        required: false
        default: homebrew-tools
        type: string
      tap-fail-if-missing-token:
        description: Fail the release instead of skipping the Homebrew publish when no tap token is available
        required: false
        default: false
        type: boolean
      tap-app-id:
        description: Optional GitHub App ID for the tap; paired with private-key
        type: string
        required: false
        default: ''
      environment:
        description: Protected release environment
        type: string
        required: false
        default: release
      snapshot:
        description: Validate/build a snapshot without publishing
        type: boolean
        required: false
        default: false
      cache:
        description: Restore dependency/build/tool caches; disable for private dependencies
        type: boolean
        required: false
        default: true
      save-cache:
        description: Save Go caches after successful checks on trusted default-branch runs; designate one writer per pipeline
        type: boolean
        required: false
        default: false
    secrets:
      github-token:
        description: GitHub token passed to GoReleaser (falls back to github.token)
        required: false
      homebrew-tap-token:
        description: Legacy PAT with repo:write for the Homebrew tap repository (prefer the GitHub App via private-key
          + inputs.tap-app-id)
        required: false
      private-key:
        description: GitHub App private key used to mint a short-lived Homebrew tap token (paired with inputs.tap-app-id)
        required: false
jobs:
  snapshot:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps: &goreleaser_steps
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Validate release authority
      env:
        SNAPSHOT: ${{ inputs.snapshot }}
        ARGS: ${{ inputs.args }}
      run: |
        python3 - <<'PY'
        import csv, os, shlex
        e = os.environ
        args = shlex.split(e['ARGS'])
        if not args or args[0] != 'release': raise SystemExit('args must invoke the release command')
        if e['SNAPSHOT'] != 'true' and (e['GITHUB_EVENT_NAME'] not in ['push','release','workflow_dispatch'] or not e['GITHUB_REF'].startswith('refs/tags/')):
            raise SystemExit('Publishing requires a trusted tag event; use snapshot:true for validation')
        if e['SNAPSHOT'] != 'true':
            index = 1
            value_flags = ['--config', '-f', '--release-notes', '--release-header', '--release-footer', '--release-notes-tmpl', '--release-header-tmpl', '--release-footer-tmpl', '--parallelism', '-p', '--timeout']
            while index < len(args):
                arg = args[index]
                flag, equals, value = arg.partition('=')
                if flag in value_flags and not equals:
                    index += 2
                    continue
                if flag in ['--snapshot', '--auto-snapshot', '--skip-publish', '--help', '-h'] and value.lower() not in ['false', '0', 'f']:
                    raise SystemExit('Publishing args cannot suppress a release; use snapshot:true for validation')
                if flag == '--skip':
                    value = value if equals else (args[index + 1] if index + 1 < len(args) else '')
                    if 'publish' in next(csv.reader([value]), []): raise SystemExit('Publishing args cannot skip publish; use snapshot:true for validation')
                    if not equals: index += 1
                index += 1
        PY
      shell: bash
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: ${{ inputs.go-version-file != '' && inputs.go-version-file || format('{0}/go.mod', inputs.working-directory)
          }}
        cache: false
    - name: Detect Go cache metadata
      id: go-cache-metadata
      shell: bash
      run: |
        {
          echo "version=$(go env GOVERSION)"
          echo "module_cache=$(go env GOMODCACHE)"
          echo "build_cache=$(go env GOCACHE)"
        } >> "$GITHUB_OUTPUT"
        printf "scope=%s\n" "$(printf %s "$MODULE_DIR" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      working-directory: ${{ inputs.working-directory }}
      env:
        MODULE_DIR: ${{ inputs.working-directory }}
    - name: Restore Go module cache
      if: ${{ inputs.cache && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.module_cache }}
        key: go-mod-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version
          }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory), format('{0}/go.sum', inputs.working-directory))
          }}
        restore-keys: |
          go-mod-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version }}-
      id: go-module-cache
    - name: Restore Go build cache
      if: ${{ inputs.cache && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.build_cache }}
        key: go-build-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version
          }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory), format('{0}/go.sum', inputs.working-directory))
          }}-${{ github.sha }}
        restore-keys: |
          go-build-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory), format('{0}/go.sum', inputs.working-directory)) }}-
      id: go-build-cache
    - name: Create GitHub App token for Homebrew tap
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ inputs.tap-app-id }}
        private-key: ${{ secrets.private-key }}
        owner: ${{ inputs.tap-owner }}
        repositories: ${{ inputs.tap-repo }}
        permission-contents: write
      if: ${{ !inputs.snapshot && inputs.tap-app-id != '' }}
      continue-on-error: true
    - name: Compute GoReleaser args
      id: goreleaser-args
      shell: bash
      env:
        TAP_TOKEN: ${{ !inputs.snapshot && (steps.app-token.outputs.token || secrets.homebrew-tap-token) || '' }}
        APP_TOKEN: ${{ steps.app-token.outputs.token || '' }}
        TAP_OWNER: ${{ inputs.tap-owner }}
        TAP_REPO: ${{ inputs.tap-repo }}
        TAP_FAIL_IF_MISSING: ${{ inputs.tap-fail-if-missing-token }}
        ARGS: ${{ inputs.args }}
        SNAPSHOT: ${{ inputs.snapshot }}
      run: |
        [[ "$ARGS" != *$'\n'* ]] || { echo '::error::args must be a single line'; exit 1; }
        if [ "$SNAPSHOT" = true ]; then
          echo "value=$ARGS --snapshot --skip=publish" >> "$GITHUB_OUTPUT"
          echo 'tap_source=snapshot' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$TAP_TOKEN" ]; then
          if [ -n "$APP_TOKEN" ]; then
            echo "tap_source=github-app" >> "$GITHUB_OUTPUT"
          else
            echo "tap_source=pat" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"
        elif [ "$TAP_FAIL_IF_MISSING" = "true" ]; then
          echo "::error title=Homebrew tap token missing::No tap token available. Configure inputs.tap-app-id + secrets.private-key (GitHub App installed on ${TAP_OWNER}/${TAP_REPO}) or pass the legacy secrets.homebrew-tap-token."
          exit 1
        else
          echo "tap_source=none" >> "$GITHUB_OUTPUT"
          echo "::warning title=Homebrew tap publish skipped::No tap token available (inputs.tap-app-id + secrets.private-key or secrets.homebrew-tap-token); the Homebrew formula will not be published."
          echo "value=$ARGS --skip=homebrew" >> "$GITHUB_OUTPUT"
        fi
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
      with:
        distribution: goreleaser
        version: ${{ inputs.goreleaser-version }}
        args: ${{ steps.goreleaser-args.outputs.value }}
        workdir: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ !inputs.snapshot && (secrets.github-token || github.token) || '' }}
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ !inputs.snapshot && (steps.app-token.outputs.token || secrets.homebrew-tap-token)
          || '' }}
      id: release
    - name: Save Go module cache
      if: ${{ success() && inputs.cache && inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-module-cache.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.module_cache }}
        key: ${{ steps.go-module-cache.outputs.cache-primary-key }}
    - name: Save Go build cache
      if: ${{ success() && inputs.cache && inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-build-cache.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.build_cache }}
        key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: GoReleaser
        FIELD_0: ${{ steps.release.outcome }}
        FIELD_1: ${{ steps.goreleaser-args.outputs.tap_source }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- Release: %s\n" "$FIELD_0"
          printf -- "- Tap token source: %s\n" "$FIELD_1"
        } >> "$GITHUB_STEP_SUMMARY"
    if: ${{ inputs.snapshot }}
  goreleaser:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    steps: *goreleaser_steps
    environment: ${{ inputs.environment }}
    concurrency:
      group: goreleaser:${{ github.repository }}
      cancel-in-progress: false
    if: ${{ !inputs.snapshot }}
