name: Aube CI
'on':
  workflow_call:
    inputs:
      node-version:
        description: Node version
        required: false
        default: '24'
        type: string
      aube-version:
        description: Aube version
        required: false
        default: 2.6.1
        type: string
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      working-directory:
        description: Directory to run commands in
        required: false
        default: .
        type: string
      require-lockfile:
        description: Fail if no supported lockfile is present
        required: false
        default: true
        type: boolean
      install-command:
        description: Override dependency install command. Empty uses aube ci.
        required: false
        default: ''
        type: string
      run-lint:
        description: Run the requested script; a missing script fails the job
        required: false
        default: true
        type: boolean
      run-test:
        description: Run the requested script; a missing script fails the job
        required: false
        default: true
        type: boolean
      run-build:
        description: Run the requested script; a missing script fails the job
        required: false
        default: false
        type: boolean
      test-script:
        description: Test script name to run
        required: false
        default: test
        type: string
      verify-lockfile-clean:
        description: Fail if lockfile has uncommitted changes after install
        required: false
        default: true
        type: boolean
      lockfile-path:
        description: Explicit lockfile path relative to working-directory
        required: false
        default: ''
        type: string
      build-env:
        description: Build step environment variables as multiline KEY=VALUE
        required: false
        default: ''
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 15
        type: number
      coverage-path:
        description: Optional coverage output paths relative to working-directory
        type: string
        required: false
        default: ''
      coverage-artifact-name:
        description: Unique coverage artifact name
        type: string
        required: false
        default: aube-coverage
      artifact-retention-days:
        description: Artifact retention in days
        type: number
        required: false
        default: 7
    secrets:
      node_auth_token:
        description: Optional registry auth token exposed to aube commands as NODE_AUTH_TOKEN
        required: false
jobs:
  ci:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Resolve artifact paths
      id: paths
      env:
        COVERAGE_PATHS: ${{ inputs.coverage-path }}
        FAILURE_PATHS: ''
      run: |
        python3 - <<'PY'
        import os, pathlib, uuid
        root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
        cwd = pathlib.Path.cwd().resolve()
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            for name, variable in [('coverage', 'COVERAGE_PATHS'), ('failure', 'FAILURE_PATHS')]:
                paths = []
                for line in os.environ[variable].splitlines():
                    if not line.strip(): continue
                    negative = line.startswith('!')
                    path = (cwd / (line[1:] if negative else line)).resolve()
                    path.relative_to(root)
                    paths.append(('!' if negative else '') + str(path))
                delimiter = 'PATHS_' + uuid.uuid4().hex
                out.write(name + '<<' + delimiter + '\n' + '\n'.join(paths) + '\n' + delimiter + '\n')
        PY
      shell: bash
    - name: Validate requested scripts and lockfile
      id: lockfile
      env:
        LOCKFILE_PATH: ${{ inputs.lockfile-path }}
        REQUIRE_LOCKFILE: ${{ inputs.require-lockfile }}
        VERIFY_LOCKFILE: ${{ inputs.verify-lockfile-clean }}
        RUN_LINT: ${{ inputs.run-lint }}
        RUN_BUILD: ${{ inputs.run-build }}
        RUN_TEST: ${{ inputs.run-test }}
        TEST_SCRIPT: ${{ inputs.test-script }}
      run: |
        python3 - <<'PY'
        import json, os, pathlib, subprocess
        package = json.loads(pathlib.Path('package.json').read_text())
        scripts = package.get('scripts', {})
        requested = [script for flag, script in [('RUN_LINT', 'lint'), ('RUN_BUILD', 'build'), ('RUN_TEST', os.environ['TEST_SCRIPT'])] if os.environ[flag] == 'true']
        if not requested: raise SystemExit('Enable at least one lint/build/test check')
        for script in requested:
            if not script or script.startswith('-') or script not in scripts: raise SystemExit('Missing or invalid requested script: ' + script)
        explicit = os.environ['LOCKFILE_PATH']
        files = [explicit] if explicit else [p for p in ['aube-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json', 'pnpm-lock.yaml', 'yarn.lock', 'bun.lock', 'bun.lockb'] if pathlib.Path(p).is_file()]
        if len(files) > 1: raise SystemExit('Multiple lockfiles; specify lockfile-path')
        lockfile = files[0] if files else ''
        if os.environ['REQUIRE_LOCKFILE'] == 'true' or os.environ['VERIFY_LOCKFILE'] == 'true':
            if not lockfile or not pathlib.Path(lockfile).is_file(): raise SystemExit('A supported lockfile is required')
            # Enforce tracked input; git diff alone misses a newly generated/untracked lockfile.
            subprocess.run(['git', 'ls-files', '--error-unmatch', '--', lockfile], check=True, stdout=subprocess.DEVNULL)
        if '\n' in lockfile: raise SystemExit('Invalid lockfile path')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('lockfile=' + lockfile + '\n')
        PY
      shell: bash
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Set up Aube
      uses: endevco/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945
      with:
        version: ${{ inputs.aube-version }}
        node-version: ''
        working-directory: ${{ inputs.working-directory }}
    - name: Install dependencies
      id: install
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
        NODE_AUTH_TOKEN: ${{ secrets.node_auth_token }}
      run: |
        if [ -n "$INSTALL_COMMAND" ]; then
          bash --noprofile --norc -eo pipefail -c "$INSTALL_COMMAND"
        else
          aube ci
        fi
      shell: bash
    - name: Verify lockfile is unchanged
      if: ${{ inputs.verify-lockfile-clean }}
      env:
        LOCKFILE: ${{ steps.lockfile.outputs.lockfile }}
      run: |
        test -f "$LOCKFILE"
        test -z "$(git status --porcelain --untracked-files=all -- "$LOCKFILE")" || { echo '::error::Lockfile changed during installation'; exit 1; }
      shell: bash
    - name: Lint
      id: lint
      if: ${{ inputs.run-lint }}
      env:
        SCRIPT_NAME: lint
        NODE_AUTH_TOKEN: ${{ secrets.node_auth_token }}
      run: |
        aube run "$SCRIPT_NAME"
      shell: bash
    - name: Build
      id: build
      if: ${{ inputs.run-build }}
      env:
        SCRIPT_NAME: build
        BUILD_ENV: ${{ inputs.build-env }}
        NODE_AUTH_TOKEN: ${{ secrets.node_auth_token }}
      run: |
        while IFS= read -r line || [ -n "$line" ]; do
          [ -z "$line" ] && continue
          [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]] || { echo '::error::build-env must contain KEY=VALUE entries'; exit 1; }
          key="${line%%=*}"
          case "$key" in GITHUB_*|RUNNER_*|ACTIONS_*|PATH|BASH_ENV|ENV|SCRIPT_NAME|BUILD_ENV|NODE_AUTH_TOKEN) echo '::error::Reserved build-env variable'; exit 1;; esac
          export "${line?}"
        done <<< "$BUILD_ENV"
        aube run "$SCRIPT_NAME"
      shell: bash
    - name: Test
      id: test
      if: ${{ inputs.run-test }}
      env:
        SCRIPT_NAME: ${{ inputs.test-script }}
        NODE_AUTH_TOKEN: ${{ secrets.node_auth_token }}
      run: |
        aube run "$SCRIPT_NAME"
      shell: bash
    - name: Upload coverage
      if: ${{ always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') && inputs.coverage-path
        != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.coverage-artifact-name }}
        path: ${{ steps.paths.outputs.coverage }}
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Aube CI
        FIELD_0: ${{ steps.install.outcome }}
        FIELD_1: ${{ steps.lint.outcome }}
        FIELD_2: ${{ steps.build.outcome }}
        FIELD_3: ${{ steps.test.outcome }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- install: %s\n" "$FIELD_0"
          printf -- "- lint: %s\n" "$FIELD_1"
          printf -- "- build: %s\n" "$FIELD_2"
          printf -- "- test: %s\n" "$FIELD_3"
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: .
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
