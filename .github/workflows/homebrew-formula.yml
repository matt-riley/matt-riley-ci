name: Homebrew Formula
'on':
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, for example v1.2.3
        required: true
        type: string
      source-repo:
        description: Repository containing release assets; defaults to the caller repository
        required: false
        default: ''
        type: string
      tap-repo:
        description: Homebrew tap repository
        required: false
        default: matt-riley/homebrew-tools
        type: string
      formula-name:
        description: Formula filename without .rb
        required: true
        type: string
      class-name:
        description: Ruby Formula class name
        required: true
        type: string
      desc:
        description: Homebrew formula description
        required: true
        type: string
      homepage:
        description: Formula homepage URL
        required: true
        type: string
      license:
        description: SPDX license expression
        required: false
        default: ''
        type: string
      binary:
        description: Binary to install from each archive
        required: true
        type: string
      archive-x86_64-macos:
        description: Release asset for Intel macOS; omit unsupported platforms
        required: false
        type: string
        default: ''
      archive-aarch64-macos:
        description: Release asset for Apple Silicon macOS; omit unsupported platforms
        required: false
        type: string
        default: ''
      archive-x86_64-linux:
        description: Release asset for x86_64 Linux; omit unsupported platforms
        required: false
        type: string
        default: ''
      archive-aarch64-linux:
        description: Release asset for aarch64 Linux; omit unsupported platforms
        required: false
        type: string
        default: ''
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 15
        type: number
      fail-if-missing-token:
        description: Fail instead of warning when homebrew-tap-token is not set
        required: false
        default: true
        type: boolean
      test-args:
        description: Shell-style argument list used by the formula test (data, no shell execution)
        type: string
        required: false
        default: --version
      environment:
        description: Optional protected environment
        type: string
        required: false
        default: ''
    secrets:
      github-token:
        description: GitHub token used to read release assets
        required: false
      homebrew-tap-token:
        description: PAT with contents:write for the Homebrew tap repository
        required: false
    outputs:
      status:
        description: published, unchanged, skipped, or failed
        value: ${{ jobs.update-formula.outputs.status }}
jobs:
  update-formula:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
    - name: Resolve publishing credential
      id: auth
      env:
        HAS_TOKEN: ${{ secrets.homebrew-tap-token != '' }}
        REQUIRED: ${{ inputs.fail-if-missing-token }}
      run: |
        if [ "$HAS_TOKEN" != true ]; then
          [ "$REQUIRED" != true ] || { echo '::error::homebrew-tap-token is required'; exit 1; }
          echo 'status=skipped' >> "$GITHUB_OUTPUT"
          echo '::warning::Tap update skipped: no publishing token'
        else
          echo 'status=ready' >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    - name: Generate and validate formula
      id: formula
      if: ${{ steps.auth.outputs.status == 'ready' }}
      env:
        GH_TOKEN: ${{ secrets.github-token || github.token }}
        SOURCE_REPO: ${{ inputs.source-repo != '' && inputs.source-repo || github.repository }}
        TAP_REPO: ${{ inputs.tap-repo }}
        TAG: ${{ inputs.tag }}
        FORMULA_NAME: ${{ inputs.formula-name }}
        CLASS_NAME: ${{ inputs.class-name }}
        DESC: ${{ inputs.desc }}
        HOMEPAGE: ${{ inputs.homepage }}
        LICENSE: ${{ inputs.license }}
        BINARY: ${{ inputs.binary }}
        ARCHIVE_X86_64_MACOS: ${{ inputs.archive-x86_64-macos }}
        ARCHIVE_AARCH64_MACOS: ${{ inputs.archive-aarch64-macos }}
        ARCHIVE_X86_64_LINUX: ${{ inputs.archive-x86_64-linux }}
        ARCHIVE_AARCH64_LINUX: ${{ inputs.archive-aarch64-linux }}
        TEST_ARGS: ${{ inputs.test-args }}
      run: |
        python3 - <<'PY'
        import hashlib, os, pathlib, re, shlex, subprocess, urllib.parse
        e = os.environ
        if e['RUNNER_OS'] != 'Linux': raise SystemExit('Homebrew generation supports Linux runners')
        if e['GITHUB_EVENT_NAME'] not in ['push', 'release', 'workflow_dispatch'] or not e['GITHUB_REF'].startswith('refs/tags/'):
            raise SystemExit('Formula publishing requires a trusted release tag')
        for key in ['SOURCE_REPO', 'TAP_REPO']:
            if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', e[key]): raise SystemExit('Invalid ' + key)
        if not re.fullmatch(r'[a-z0-9][a-z0-9+_.-]*', e['FORMULA_NAME']): raise SystemExit('Invalid formula name')
        if not re.fullmatch(r'[A-Z][A-Za-z0-9]*', e['CLASS_NAME']): raise SystemExit('Invalid Ruby class name')
        if not re.fullmatch(r'v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', e['TAG']): raise SystemExit('Invalid release tag')
        if e['GITHUB_REF'] != 'refs/tags/' + e['TAG']: raise SystemExit('tag must match the triggering release ref')
        binary = pathlib.PurePosixPath(e['BINARY'])
        if binary.is_absolute() or '..' in binary.parts or not binary.name or e['BINARY'].endswith('/'): raise SystemExit('Invalid binary path')
        def ruby(value):
            return "'" + value.replace('\\', '\\\\').replace("'", "\\'") + "'"
        assets = pathlib.Path(e['RUNNER_TEMP']) / 'homebrew-assets'
        assets.mkdir(parents=True, exist_ok=True)
        lines = ['# frozen_string_literal: true', '# Managed by CI.', 'class ' + e['CLASS_NAME'] + ' < Formula']
        for key, value in [('desc', e['DESC']), ('homepage', e['HOMEPAGE']), ('version', e['TAG'].removeprefix('v')), ('license', e['LICENSE'])]:
            if value: lines.append('  ' + key + ' ' + ruby(value))
        count = 0
        for platform, architectures in [('macos', [('intel', 'ARCHIVE_X86_64_MACOS'), ('arm', 'ARCHIVE_AARCH64_MACOS')]), ('linux', [('intel', 'ARCHIVE_X86_64_LINUX'), ('arm', 'ARCHIVE_AARCH64_LINUX')])]:
            blocks = []
            for architecture, key in architectures:
                asset = e[key]
                if not asset: continue
                if pathlib.PurePosixPath(asset).name != asset or not re.fullmatch(r'[A-Za-z0-9_.+-]+', asset): raise SystemExit('Invalid asset filename')
                subprocess.run(['gh', 'release', 'download', e['TAG'], '--repo', e['SOURCE_REPO'], '--pattern', asset, '--dir', str(assets), '--clobber'], check=True)
                checksum = hashlib.sha256()
                with (assets / asset).open('rb') as stream:
                    for chunk in iter(lambda: stream.read(1024 * 1024), b''): checksum.update(chunk)
                digest = checksum.hexdigest()
                url = 'https://github.com/' + e['SOURCE_REPO'] + '/releases/download/' + urllib.parse.quote(e['TAG'], safe='') + '/' + urllib.parse.quote(asset, safe='')
                blocks += ['    on_' + architecture + ' do', '      url ' + ruby(url), '      sha256 ' + ruby(digest), '    end']
                count += 1
            if blocks: lines += ['  on_' + platform + ' do'] + blocks + ['  end']
        if not count: raise SystemExit('At least one platform archive is required')
        lines += ['  def install', '    bin.install ' + ruby(e['BINARY']), '  end', '  test do', '    system bin/' + ruby(binary.name) + ''.join(', ' + ruby(arg) for arg in shlex.split(e['TEST_ARGS'])), '  end', 'end']
        formula = pathlib.Path(e['RUNNER_TEMP']) / (e['FORMULA_NAME'] + '.rb')
        formula.write_text('\n'.join(lines) + '\n')
        subprocess.run(['ruby', '-c', str(formula)], check=True)
        PY
      shell: bash
    - name: Checkout tap
      if: ${{ steps.auth.outputs.status == 'ready' }}
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        repository: ${{ inputs.tap-repo }}
        token: ${{ secrets.homebrew-tap-token }}
        path: .ci/homebrew-tap
        persist-credentials: false
    - name: Publish validated formula
      id: publish
      if: ${{ steps.auth.outputs.status == 'ready' }}
      working-directory: .ci/homebrew-tap
      env:
        FORMULA_NAME: ${{ inputs.formula-name }}
        TAG: ${{ inputs.tag }}
        PUSH_TOKEN: ${{ secrets.homebrew-tap-token }}
      run: |
        # shellcheck disable=SC2016
        # The helper expands PUSH_TOKEN only when git invokes it.
        mkdir -p Formula
        cp "$RUNNER_TEMP/$FORMULA_NAME.rb" "Formula/$FORMULA_NAME.rb"
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -- "Formula/$FORMULA_NAME.rb"
        if git diff --cached --quiet; then echo 'status=unchanged' >> "$GITHUB_OUTPUT"; exit 0; fi
        git commit -m "chore: update $FORMULA_NAME to $TAG"
        # shellcheck disable=SC2016
        authenticated_git() {
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$PUSH_TOKEN"; }; f' "$@"
        }
        branch="$(git symbolic-ref --short HEAD)"
        for attempt in 1 2 3; do
          if authenticated_git push origin "HEAD:refs/heads/$branch"; then
            echo 'status=published' >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Groups are repository-scoped. Another caller may advance this tap.
          authenticated_git fetch --no-tags origin "refs/heads/$branch"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo '::error::Tap push failed without a concurrent branch update'; exit 1
          fi
          if ! git rebase FETCH_HEAD; then
            git rebase --abort
            echo '::error::Concurrent tap update conflicts with this formula; retry after review'; exit 1
          fi
          printf 'Retrying tap publication after concurrent update (attempt %s)\n' "$attempt"
        done
        echo '::error::Tap changed repeatedly; publication retry limit reached'; exit 1
      shell: bash
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Homebrew formula
        FIELD_0: ${{ steps.publish.outputs.status || (steps.auth.outputs.status == 'skipped' && 'skipped') || 'failed' }}
        FIELD_1: ${{ steps.formula.outcome }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- Result: %s\n" "$FIELD_0"
          printf -- "- Formula validation: %s\n" "$FIELD_1"
        } >> "$GITHUB_STEP_SUMMARY"
    environment: ${{ inputs.environment }}
    concurrency:
      group: homebrew:${{ inputs.tap-repo }}
      queue: max
      cancel-in-progress: false
    outputs:
      status: ${{ steps.publish.outputs.status || (steps.auth.outputs.status == 'skipped' && 'skipped') || 'failed' }}
