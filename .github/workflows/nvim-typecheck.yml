name: Neovim Typecheck (LuaLS)
'on':
  workflow_call:
    inputs:
      check-path:
        description: Path passed to lua-language-server --check, relative to working-directory
        required: false
        default: .
        type: string
      checklevel:
        description: Lowest diagnostic severity reported by LuaLS (Error, Warning, Information or Hint)
        required: false
        default: Warning
        type: string
      luals-version:
        description: Pinned LuaLS release; pair overrides with luals-sha256
        required: false
        default: 3.13.6
        type: string
      luals-sha256:
        description: Expected SHA-256 of the Linux x64 LuaLS archive; pair overrides with luals-version
        required: false
        default: 347cb07e609cb84d9731c04603340ae749d8abe802f1ad50607383ab0e865366
        type: string
      neovim-version:
        description: Exact Neovim release tag, or nightly; its runtime is exposed to LuaLS as VIMRUNTIME
        required: false
        default: v0.12.5
        type: string
      neovim-sha256:
        description: Reviewed SHA-256 override takes precedence over the default pin; required for nondefault stable releases. Empty nightly uses metadata.
        required: false
        default: ''
        type: string
      runner:
        description: Runner label; Linux x64 only, and self-hosted runners must provision gh, Python 3 and tar
        required: false
        default: ubuntu-latest
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 15
        type: number
      working-directory:
        description: Directory containing the Lua sources and .luarc.json
        type: string
        required: false
        default: .
jobs:
  typecheck:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Install Neovim
      env:
        VERSION: ${{ inputs.neovim-version }}
        EXPECTED_SHA256: ${{ inputs.neovim-sha256 }}
        GH_TOKEN: ${{ github.token }}
      run: |
        for executable in gh python3 tar git; do
          command -v "$executable" >/dev/null || { echo "::error::Runner prerequisite missing: $executable. Provision it on self-hosted runners."; exit 1; }
        done
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) platform=linux-x86_64;;
          Linux/ARM64) platform=linux-arm64;;
          macOS/X64) platform=macos-x86_64;;
          macOS/ARM64) platform=macos-arm64;;
          *) echo '::error::Neovim tests support Linux/macOS x64/arm64 runners'; exit 1;;
        esac
        [[ "$VERSION" = nightly || "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
        [[ "$VERSION" = v0.12.5 || "$VERSION" = nightly || "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Release overrides require neovim-sha256'; exit 1; }
        install_dir="$RUNNER_TEMP/neovim"
        mkdir -p "$install_dir"
        if [ "$VERSION" != nightly ] || [ -n "$EXPECTED_SHA256" ]; then
          gh release download "$VERSION" --repo neovim/neovim --pattern "nvim-$platform.tar.gz" --dir "$install_dir"
        fi
        export ASSET_NAME="nvim-$platform.tar.gz"
        python3 - <<'PY'
        import hashlib, json, os, pathlib, re, subprocess
        pinned = {
            'nvim-linux-x86_64.tar.gz': 'bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875',
            'nvim-linux-arm64.tar.gz': '1aa5ca085249580ae0f91eb14f27ec0919773ff2d99a163d03f3d6c21ac29725',
            'nvim-macos-x86_64.tar.gz': '81f4518622cb059b450ee2e498c6a1082a222f6bd89589de5bbcf0c6a68aa3fd',
            'nvim-macos-arm64.tar.gz': '65fb000099e47ca1b762584c484cc833f40e30851a0ec450d4174e16317c1f9b',
        }
        e = os.environ
        directory = pathlib.Path(e['RUNNER_TEMP']) / 'neovim'
        archive = directory / e['ASSET_NAME']
        expected = e['EXPECTED_SHA256'] or (pinned[e['ASSET_NAME']] if e['VERSION'] == 'v0.12.5' else '')
        if not expected and e['VERSION'] == 'nightly':
            # Resolve the asset ID and digest together. A replacement can delete
            # that ID, so allow one fresh snapshot without relaxing verification.
            for attempt in range(2):
                try:
                    assets = json.loads(subprocess.check_output(['gh', 'api', 'repos/neovim/neovim/releases/tags/nightly'], text=True))['assets']
                    matching = [a for a in assets if a['name'] == e['ASSET_NAME']]
                    if len(matching) != 1: raise SystemExit('Nightly requires exactly one matching release asset')
                    asset = matching[0]
                    digest = asset.get('digest') or ''
                    expected = digest.removeprefix('sha256:') if digest.startswith('sha256:') else ''
                    if not re.fullmatch(r'[0-9a-f]{64}', expected): raise SystemExit('Nightly requires GitHub SHA-256 metadata')
                    if type(asset.get('id')) is not int or asset['id'] <= 0: raise SystemExit('Nightly requires a valid release asset ID')
                    with archive.open('wb') as out:
                        subprocess.run(['gh', 'api', 'repos/neovim/neovim/releases/assets/' + str(asset['id']), '-H', 'Accept: application/octet-stream'], stdout=out, check=True)
                except subprocess.CalledProcessError:
                    if attempt == 1: raise SystemExit('Nightly download failed after one retry')
                    print('::notice::Nightly asset unavailable; retrying with a fresh metadata snapshot')
                    continue
                if hashlib.sha256(archive.read_bytes()).hexdigest() == expected: break
                if attempt == 1: raise SystemExit('Neovim asset checksum mismatch')
                print('::notice::Nightly checksum mismatch; retrying with a fresh metadata snapshot')
        if not re.fullmatch(r'[0-9a-f]{64}', expected): raise SystemExit('Release overrides require neovim-sha256; nightly requires GitHub SHA-256 metadata')
        if hashlib.sha256(archive.read_bytes()).hexdigest() != expected: raise SystemExit('Neovim asset checksum mismatch')
        PY
        tar -xzf "$install_dir/nvim-$platform.tar.gz" -C "$install_dir"
        echo "$install_dir/nvim-$platform/bin" >> "$GITHUB_PATH"
      shell: bash
    - name: Install LuaLS
      env:
        VERSION: ${{ inputs.luals-version }}
        EXPECTED_SHA256: ${{ inputs.luals-sha256 }}
        GH_TOKEN: ${{ github.token }}
      run: |
        for executable in gh python3 tar; do
          command -v "$executable" >/dev/null || { echo "::error::Runner prerequisite missing: $executable. Provision it on self-hosted runners."; exit 1; }
        done
        [ "$RUNNER_OS/$RUNNER_ARCH" = Linux/X64 ] || { echo '::error::Standalone LuaLS typechecking supports Linux x64; use Universal CI for other platforms'; exit 1; }
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::luals-version must be a release such as 3.13.6'; exit 1; }
        [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::luals-sha256 must be a lowercase SHA-256 digest'; exit 1; }
        install_dir="$RUNNER_TEMP/luals"
        mkdir -p "$install_dir"
        gh release download "$VERSION" --repo LuaLS/lua-language-server --pattern "lua-language-server-$VERSION-linux-x64.tar.gz" --dir "$install_dir"
        export ASSET_NAME="lua-language-server-$VERSION-linux-x64.tar.gz"
        python3 - <<'PY'
        import hashlib, os, pathlib
        archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'luals' / os.environ['ASSET_NAME']
        if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['EXPECTED_SHA256']:
            raise SystemExit('LuaLS archive checksum mismatch; refusing to execute it')
        PY
        tar -xzf "$install_dir/$ASSET_NAME" -C "$install_dir"
        echo "$install_dir/bin" >> "$GITHUB_PATH"
      shell: bash
    - name: Run typecheck
      id: check
      env:
        CHECK_PATH: ${{ inputs.check-path }}
        CHECKLEVEL: ${{ inputs.checklevel }}
      run: |
        [[ "$CHECKLEVEL" =~ ^(Error|Warning|Information|Hint)$ ]] || { echo '::error::checklevel must be Error, Warning, Information or Hint'; exit 1; }
        [ -n "${CHECK_PATH//[[:space:]]/}" ] && [[ "$CHECK_PATH" != -* ]] || { echo '::error::check-path must be a path, not an option'; exit 1; }
        VIMRUNTIME="$(nvim --headless -u NONE -c 'lua io.write(vim.env.VIMRUNTIME)' -c 'qa!' 2>/dev/null)"
        [ -d "$VIMRUNTIME" ] || { echo '::error::Could not resolve the Neovim runtime directory'; exit 1; }
        export VIMRUNTIME
        log_dir="$RUNNER_TEMP/luals-log"
        rm -rf "$log_dir"
        mkdir -p "$log_dir"
        status=0
        lua-language-server --check="$CHECK_PATH" --checklevel="$CHECKLEVEL" --check_format=json --logpath="$log_dir" || status=$?
        LOG_DIR="$log_dir" LUALS_STATUS="$status" python3 - <<'PY'
        import json, os, pathlib, sys
        path = pathlib.Path(os.environ['LOG_DIR']) / 'check.json'
        if not path.is_file():
            raise SystemExit('LuaLS wrote no check.json (exit status ' + os.environ['LUALS_STATUS'] + '); treating the typecheck as failed')
        diagnostics = json.loads(path.read_text() or '[]')
        if diagnostics:
            print(json.dumps(diagnostics, indent=2))
            sys.exit(1)
        if os.environ['LUALS_STATUS'] != '0':
            raise SystemExit('LuaLS exited with status ' + os.environ['LUALS_STATUS'] + ' without reporting diagnostics')
        print('LuaLS diagnostics: none')
        PY
      shell: bash
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Neovim typecheck
        FIELD_0: ${{ steps.check.outcome }}
        FIELD_1: ${{ inputs.luals-version }}
        FIELD_2: ${{ inputs.neovim-version }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- Typecheck: %s\n" "$FIELD_0"
          printf -- "- LuaLS: %s\n" "$FIELD_1"
          printf -- "- Neovim: %s\n" "$FIELD_2"
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: .
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
