name: Neovim Format (stylua)
'on':
  workflow_call:
    inputs:
      paths:
        description: Shell-style quoted path list, passed as arguments without shell evaluation
        required: false
        default: lua/ plugin/ tests/
        type: string
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      stylua-version:
        description: Pinned stylua release
        type: string
        required: false
        default: v2.4.0
      stylua-sha256:
        description: Reviewed asset SHA-256 for version overrides; empty uses pinned per-platform v2.4.0 digests
        type: string
        required: false
        default: ''
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 15
        type: number
      working-directory:
        description: Directory containing Lua sources and tool configuration
        type: string
        required: false
        default: .
jobs:
  stylua:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Install stylua
      env:
        VERSION: ${{ inputs.stylua-version }}
        EXPECTED_SHA256: ${{ inputs.stylua-sha256 }}
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=stylua-linux-x86_64.zip;;
          Linux/ARM64) asset=stylua-linux-aarch64.zip;;
          macOS/X64) asset=stylua-macos-x86_64.zip;;
          macOS/ARM64) asset=stylua-macos-aarch64.zip;;
          *) echo '::error::StyLua supports Linux/macOS x64/arm64 runners'; exit 1;;
        esac
        [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
        [[ "$VERSION" = v2.4.0 || "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Version overrides require stylua-sha256'; exit 1; }
        install_dir="$RUNNER_TEMP/stylua-bin"
        mkdir -p "$install_dir"
        gh release download "$VERSION" --repo JohnnyMorganz/StyLua --pattern "$asset" --dir "$install_dir"
        export ASSET_NAME="$asset"
        python3 - <<'PY'
        import hashlib, os, pathlib, re
        pinned = {
            'stylua-linux-x86_64.zip': 'f9c84c210712061cb03ab8354a34a5d4f5fcf1f369d2ce916bea3ab9f7addac8',
            'stylua-linux-aarch64.zip': '67bbd6ad4d864ab375babdd125ed926183968f5b6e55d7e0a6f9f425511a5408',
            'stylua-macos-x86_64.zip': 'bf2ce0a1431c39800cf19068ac50deec5c79e5fa99900cc99159de9c1af80254',
            'stylua-macos-aarch64.zip': 'ec74ecdc30ec15aefa15f65cc55d6f10f91f97dd30c39c4347954af849e3f248',
        }
        e = os.environ
        expected = e['EXPECTED_SHA256'] or (pinned[e['ASSET_NAME']] if e['VERSION'] == 'v2.4.0' else '')
        if not re.fullmatch(r'[0-9a-f]{64}', expected): raise SystemExit('Version overrides require a reviewed stylua-sha256')
        asset = pathlib.Path(e['RUNNER_TEMP']) / 'stylua-bin' / e['ASSET_NAME']
        if hashlib.sha256(asset.read_bytes()).hexdigest() != expected: raise SystemExit('StyLua asset checksum mismatch')
        PY
        unzip -q "$install_dir/$asset" -d "$install_dir"
        chmod +x "$install_dir/stylua"
        echo "$install_dir" >> "$GITHUB_PATH"
      shell: bash
    - name: Check stylua
      id: check
      env:
        SOURCE_PATHS: ${{ inputs.paths }}
      run: |
        python3 - <<'PY'
        import os, shlex, subprocess
        paths = shlex.split(os.environ['SOURCE_PATHS'])
        if not paths or any(p.startswith('-') for p in paths): raise SystemExit('At least one source path is required; options are not accepted in paths')
        subprocess.run(['stylua', '--check'] + paths, check=True)
        PY
      shell: bash
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: stylua
        FIELD_0: ${{ steps.check.outcome }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- Check: %s\n" "$FIELD_0"
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: .
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
