name: Workflow checks
'on':
  workflow_call:
    outputs:
      tested_sha:
        description: Exact validated revision
        value: ${{ jobs.checks.outputs.tested_sha }}
  pull_request: null
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.14'
    - name: Install actionlint
      uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
      with:
        version: 2026.9.18
        install_args: actionlint
        add_shims_to_path: false
        cache_save: false
    - name: Install validation dependencies
      run: |
        python -m pip install --disable-pip-version-check -r requirements-dev.txt
      shell: bash
    - name: Validate and test workflow contracts
      run: |
        python scripts/check.py
      shell: bash
  go:
    uses: ./.github/workflows/go-ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/go
      test-args: -coverprofile=coverage.out
      coverage-path: coverage.out
      coverage-artifact-name: go-coverage
      build-command: go build -ldflags "-s -w" ./...
  go-lint:
    uses: ./.github/workflows/go-lint.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/go
  go-security:
    uses: ./.github/workflows/go-security.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/go
  node:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/node
      install-tools: node
      test: true
      build: true
      task-jobs: 4
      task-env: |
        API_ENDPOINT_URL=https://example.test
      artifact-path: dist
      artifact-name: site-fixture
  bun:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/bun
      install-tools: bun
  neutral:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/neutral
      install-tools: actionlint
      cache: false
  aube:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/aube-ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/node
      run-lint: false
      run-build: true
      build-env: |
        API_ENDPOINT_URL=https://example.test
  docker:
    uses: ./.github/workflows/docker-ghcr-publish.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    permissions:
      contents: read
      packages: write
    with:
      context: fixtures/docker
      push: false
      load: true
      provenance: false
      sbom: false
  nvim-format:
    uses: ./.github/workflows/nvim-format.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/nvim
      paths: lua tests
  nvim-lint:
    uses: ./.github/workflows/nvim-lint.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/nvim
      paths: lua tests
  nvim-tests:
    uses: ./.github/workflows/nvim-tests.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ workflow calls; resolved from this commit
    with:
      working-directory: fixtures/nvim
  artifacts:
    needs:
    - node
    - go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Download build output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: site-fixture
        path: site
    - name: Download coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: go-coverage
        path: coverage
    - name: Check handoff
      run: |
        test -s site/index.html
        test -s coverage/coverage.out
      shell: bash
  checks:
    if: ${{ always() }}
    needs:
    - validate
    - go
    - go-lint
    - go-security
    - node
    - bun
    - neutral
    - aube
    - docker
    - nvim-format
    - nvim-lint
    - nvim-tests
    - artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested_sha: ${{ steps.result.outputs.sha }}
    steps:
    - name: Require every check
      id: result
      env:
        RESULTS: ${{ toJSON(needs) }}
        SHA: ${{ github.sha }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        if any(job['result'] != 'success' for job in results.values()): raise SystemExit('A required check failed, was cancelled, or skipped')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('sha=' + os.environ['SHA'] + '\n')
        PY
      shell: bash
