name: Cloudflare Pages Deploy
'on':
  workflow_call:
    inputs:
      project-name:
        description: Cloudflare Pages project
        type: string
        required: true
      artifact-name:
        description: Build artifact from an earlier job in this same workflow run
        type: string
        required: true
      deploy-directory:
        description: Directory within the downloaded artifact
        type: string
        required: false
        default: .
      branch:
        description: Pages deployment branch; empty uses the trusted source branch
        type: string
        required: false
        default: ''
      environment:
        description: Protected GitHub deployment environment
        type: string
        required: false
        default: production
      wrangler-version:
        description: Pinned Wrangler CLI release
        type: string
        required: false
        default: 4.146.0
      runner:
        description: Linux runner label
        type: string
        required: false
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout
        type: number
        required: false
        default: 15
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Account-scoped Cloudflare API token with Pages edit permission
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account ID
        required: true
    outputs:
      deployment_url:
        description: Published deployment URL
        value: ${{ jobs.deploy.outputs.deployment_url }}
jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
    - name: Validate deployment source
      env:
        PROJECT: ${{ inputs.project-name }}
        DIRECTORY: ${{ inputs.deploy-directory }}
        BRANCH: ${{ inputs.branch }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        python3 - <<'PY'
        import os, pathlib, re
        e = os.environ
        if e['RUNNER_OS'] != 'Linux': raise SystemExit('Pages deployment supports Linux runners')
        if e['GITHUB_EVENT_NAME'] not in ['push', 'workflow_dispatch'] or e['GITHUB_REF'] != 'refs/heads/' + e['DEFAULT_BRANCH']:
            raise SystemExit('Deployments require a trusted default-branch push or manual run')
        if not re.fullmatch(r'[a-z0-9][a-z0-9-]*', e['PROJECT']): raise SystemExit('Invalid Pages project name')
        path = pathlib.PurePosixPath(e['DIRECTORY'])
        if path.is_absolute() or '..' in path.parts or not re.fullmatch(r'[A-Za-z0-9_./-]+', e['DIRECTORY']): raise SystemExit('Invalid deploy-directory')
        branch = e['BRANCH'] or e['GITHUB_REF_NAME']
        if not re.fullmatch(r'[A-Za-z0-9_./-]+', branch): raise SystemExit('Invalid branch')
        with open(e['GITHUB_OUTPUT'], 'a') as out: out.write('branch=' + branch + '\n')
        PY
      id: source
      shell: bash
    - name: Download built site
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/pages-site
    - name: Set up deployment runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Deploy to Cloudflare Pages
      id: deploy
      uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        wranglerVersion: ${{ inputs.wrangler-version }}
        workingDirectory: ${{ runner.temp }}/pages-site
        command: pages deploy ${{ inputs.deploy-directory }} --project-name=${{ inputs.project-name }} --branch=${{
          steps.source.outputs.branch }} --commit-hash=${{ github.sha }}
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Cloudflare Pages
        FIELD_0: ${{ steps.deploy.outcome }}
        FIELD_1: ${{ steps.deploy.outputs.deployment-url }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- Deploy: %s\n" "$FIELD_0"
          printf -- "- URL: %s\n" "$FIELD_1"
        } >> "$GITHUB_STEP_SUMMARY"
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: cloudflare-pages:${{ github.repository }}:${{ inputs.project-name }}:${{ inputs.environment }}
      cancel-in-progress: false
