name: Release Please
'on':
  workflow_call:
    inputs:
      config-file:
        description: Path to release-please config
        required: false
        default: release-please-config.json
        type: string
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      manifest-file:
        description: Path to release-please manifest
        required: false
        default: .release-please-manifest.json
        type: string
      component-output-key:
        description: Optional component path for monorepo outputs (for example clients/typescript)
        required: false
        default: ''
        type: string
      target-branch:
        description: Release target branch; empty uses repository default branch
        type: string
        required: false
        default: ''
      environment:
        description: Optional protected environment
        type: string
        required: false
        default: ''
    secrets:
      token:
        description: GitHub token
        required: false
    outputs:
      release_created:
        description: Whether a release was created
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Created release tag
        value: ${{ jobs.release-please.outputs.tag_name }}
      component_release_created:
        description: Whether release was created for component-output-key
        value: ${{ jobs.release-please.outputs.component_release_created }}
      component_tag_name:
        description: Created release tag for component-output-key
        value: ${{ jobs.release-please.outputs.component_tag_name }}
      raw_outputs_json:
        description: All release-please step outputs as JSON
        value: ${{ jobs.release-please.outputs.raw_outputs_json }}
jobs:
  release-please:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      component_release_created: ${{ inputs.component-output-key != '' && steps.release.outputs[format('{0}--release_created',
        inputs.component-output-key)] || '' }}
      component_tag_name: ${{ inputs.component-output-key != '' && steps.release.outputs[format('{0}--tag_name',
        inputs.component-output-key)] || '' }}
      raw_outputs_json: ${{ toJSON(steps.release.outputs) }}
    steps:
    - id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
      with:
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}
        token: ${{ secrets.token || github.token }}
        target-branch: ${{ inputs.target-branch }}
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Release Please
        FIELD_0: ${{ inputs.runner }}
        FIELD_1: ${{ inputs.config-file }}
        FIELD_2: ${{ inputs.manifest-file }}
        FIELD_3: ${{ steps.release.outputs.release_created }}
        FIELD_4: ${{ steps.release.outputs.tag_name }}
        FIELD_5: ${{ inputs.component-output-key }}
        FIELD_6: ${{ inputs.component-output-key != '' && steps.release.outputs[format('{0}--release_created', inputs.component-output-key)]
          || '' }}
        FIELD_7: ${{ inputs.component-output-key != '' && steps.release.outputs[format('{0}--tag_name', inputs.component-output-key)]
          || '' }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- runner: %s\n" "$FIELD_0"
          printf -- "- config-file: %s\n" "$FIELD_1"
          printf -- "- manifest-file: %s\n" "$FIELD_2"
          printf -- "- release_created: %s\n" "$FIELD_3"
          printf -- "- tag_name: %s\n" "$FIELD_4"
          printf -- "- component-output-key: %s\n" "$FIELD_5"
          printf -- "- component_release_created: %s\n" "$FIELD_6"
          printf -- "- component_tag_name: %s\n" "$FIELD_7"
        } >> "$GITHUB_STEP_SUMMARY"
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}',
      inputs.target-branch != '' && inputs.target-branch || github.event.repository.default_branch) }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: release-please:${{ github.repository }}:${{ inputs.target-branch }}
      cancel-in-progress: false
