name: Go CI
'on':
  workflow_call:
    inputs:
      go-version-file:
        description: Module file relative to repository root; empty resolves working-directory/go.mod
        required: false
        default: ''
        type: string
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      working-directory:
        description: Directory to run commands in
        required: false
        default: .
        type: string
      run-test:
        description: Run tests
        required: false
        default: true
        type: boolean
      run-race:
        description: Run tests with -race
        required: false
        default: false
        type: boolean
      run-vet:
        description: Run go vet
        required: false
        default: true
        type: boolean
      run-fmt:
        description: Check formatting with gofmt
        required: false
        default: false
        type: boolean
      run-verify:
        description: Run go mod verify to check that downloaded module contents match go.sum
        required: false
        default: false
        type: boolean
      run-tidy:
        description: Fail if go mod tidy would change go.mod or go.sum (the files are restored afterwards)
        required: false
        default: false
        type: boolean
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 15
        type: number
      test-args:
        description: Extra args passed to go test
        required: false
        default: ''
        type: string
      test-command:
        description: Custom command to run instead of the default go test invocation; bypasses test-args and run-race
        required: false
        default: ''
        type: string
      build-command:
        description: Optional build command to run before tests
        required: false
        default: ''
        type: string
      coverage-path:
        description: Optional coverage file path relative to working-directory to upload as an artifact
        required: false
        default: ''
        type: string
      coverage-artifact-name:
        description: Artifact name for uploaded coverage output
        required: false
        default: ''
        type: string
      coverage-threshold:
        description: Minimum total statement coverage percent (0-100) read from the Go profile named by coverage-path; 0 disables the gate. Requires run-test,
          coverage-path, coverage-artifact-name and test-args or test-command that write the profile
        required: false
        default: 0
        type: number
      artifact-retention-days:
        description: Coverage/diagnostic retention
        type: number
        required: false
        default: 7
      failure-artifact-path:
        description: Optional diagnostics relative to working-directory
        type: string
        required: false
        default: ''
      failure-artifact-name:
        description: Unique failure artifact name
        type: string
        required: false
        default: go-diagnostics
      cache:
        description: Restore dependency/build/tool caches; disable for private dependencies
        type: boolean
        required: false
        default: true
      save-cache:
        description: Save Go caches after successful checks on trusted default-branch runs; designate one writer per pipeline
        type: boolean
        required: false
        default: false
jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Resolve artifact paths
      id: paths
      env:
        RETENTION: ${{ inputs.artifact-retention-days }}
        COVERAGE_PATHS: ${{ inputs.coverage-path }}
        COVERAGE_NAME: ${{ inputs.coverage-artifact-name }}
        FAILURE_NAME: ${{ inputs.failure-artifact-name }}
        FAILURE_PATHS: ${{ inputs.failure-artifact-path }}
      run: |
        python3 - <<'PY'
        import os, pathlib, re, uuid
        retention = os.environ['RETENTION']
        if not re.fullmatch(r'[1-9][0-9]*', retention): raise SystemExit('Artifact retention must be a positive integer')
        if int(retention) > int(os.environ.get('GITHUB_RETENTION_DAYS', '90')): raise SystemExit('Artifact retention exceeds the repository limit')
        for variable in ['COVERAGE_NAME', 'FAILURE_NAME']:
            if any(char in os.environ.get(variable, '') for char in '\"/:<>|*?\\\r\n'):
                raise SystemExit(variable + ' contains a character forbidden in artifact names')
        root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
        cwd = pathlib.Path.cwd().resolve()
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            for name, variable in [('coverage', 'COVERAGE_PATHS'), ('failure', 'FAILURE_PATHS')]:
                paths = []
                for line in os.environ[variable].splitlines():
                    if not line.strip(): continue
                    negative = line.startswith('!')
                    path = (cwd / (line[1:] if negative else line)).resolve()
                    path.relative_to(root)
                    if path == root: raise SystemExit('Artifact paths must select a child of the repository')
                    paths.append(('!' if negative else '') + str(path))
                if os.environ[variable] and not any(not path.startswith('!') for path in paths):
                    raise SystemExit(variable + ' requires at least one inclusion path')
                delimiter = 'PATHS_' + uuid.uuid4().hex
                out.write(name + '<<' + delimiter + '\n' + '\n'.join(paths) + '\n' + delimiter + '\n')
        PY
      shell: bash
    - name: Require a Go check
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
        RUN_TEST: ${{ inputs.run-test }}
        RUN_VET: ${{ inputs.run-vet }}
        RUN_FMT: ${{ inputs.run-fmt }}
      run: |
        if [ -z "${BUILD_COMMAND//[[:space:]]/}" ] && [ "$RUN_TEST" != true ] && [ "$RUN_VET" != true ] && [ "$RUN_FMT" != true ]; then
          echo '::error::Enable at least one build/test/vet/format check'; exit 1
        fi
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: ${{ inputs.go-version-file != '' && inputs.go-version-file || format('{0}/go.mod', inputs.working-directory || '.')
          }}
        cache: false
    - name: Detect Go cache metadata
      id: go-cache-metadata
      shell: bash
      run: |
        {
          echo "version=$(go env GOVERSION)"
          echo "module_cache=$(go env GOMODCACHE)"
          echo "build_cache=$(go env GOCACHE)"
        } >> "$GITHUB_OUTPUT"
        printf "scope=%s\n" "$(printf %s "$MODULE_DIR" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        MODULE_DIR: ${{ inputs.working-directory || '.' }}
    - name: Restore Go module cache
      if: ${{ inputs.cache && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.module_cache }}
        key: go-mod-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version
          }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory || '.'), format('{0}/go.sum', inputs.working-directory || '.'))
          }}
        restore-keys: |
          go-mod-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version }}-
      id: go-module-cache
    - name: Restore Go build cache
      if: ${{ inputs.cache && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.build_cache }}
        key: go-build-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version
          }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory || '.'), format('{0}/go.sum', inputs.working-directory || '.'))
          }}-${{ github.sha }}
        restore-keys: |
          go-build-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory || '.'), format('{0}/go.sum', inputs.working-directory || '.')) }}-
      id: go-build-cache
    - name: Validate test inputs
      if: ${{ inputs.run-test && inputs.test-command != '' && (inputs.run-race || inputs.test-args != '') }}
      run: |
        echo "::error title=Invalid Go CI inputs::test-command bypasses run-race and test-args. Include any race or extra test flags directly in test-command, or unset test-command to use the default test runner."
        exit 1
      shell: bash
    - name: Validate coverage inputs
      if: ${{ (inputs.coverage-path == '' && inputs.coverage-artifact-name != '') || (inputs.coverage-path != ''
        && inputs.coverage-artifact-name == '') || (inputs.coverage-path != '' && !inputs.run-test) }}
      run: |
        echo "::error title=Invalid Go CI inputs::coverage-path and coverage-artifact-name must be set together to upload coverage artifacts."
        exit 1
      shell: bash
    - name: Validate coverage threshold
      id: coverage-threshold-inputs
      if: ${{ inputs.coverage-threshold != 0 }}
      env:
        THRESHOLD: ${{ inputs.coverage-threshold }}
        COVERAGE_PATH: ${{ inputs.coverage-path }}
        RUN_TEST: ${{ inputs.run-test }}
      run: |
        fail() { echo "::error title=Invalid Go CI inputs::$1"; exit 1; }
        [[ "$THRESHOLD" =~ ^[0-9]+(\.[0-9]+)?$ ]] || fail 'coverage-threshold must be a number above 0 and at most 100 (0 disables the gate).'
        awk -v t="$THRESHOLD" 'BEGIN { exit !(t > 0 && t <= 100) }' || fail 'coverage-threshold must be a number above 0 and at most 100 (0 disables the gate).'
        [ "$RUN_TEST" = true ] || fail 'coverage-threshold requires run-test.'
        [ -n "${COVERAGE_PATH//[[:space:]]/}" ] || fail 'coverage-threshold requires coverage-path to name the Go coverage profile.'
        mapfile -t lines <<< "$COVERAGE_PATH"
        if [ "${#lines[@]}" -ne 1 ] || [[ "${lines[0]}" == '!'* || "${lines[0]}" == *[\*\?\[]* ]]; then
          fail 'coverage-threshold needs coverage-path to be one exact file path, with no globs or exclusions.'
        fi
      shell: bash
    - name: Build
      id: build
      if: ${{ inputs.build-command != '' }}
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: |
        bash --noprofile --norc -eo pipefail -c "$BUILD_COMMAND"
      shell: bash
    - name: Verify modules (go mod verify)
      id: verify
      if: ${{ inputs.run-verify }}
      run: |
        go mod verify
      shell: bash
    - name: Check go mod tidy
      id: tidy
      if: ${{ inputs.run-tidy }}
      run: |
        reference="$(mktemp -d)"
        had_sum=false
        cp go.mod "$reference/go.mod"
        if [ -e go.sum ]; then had_sum=true; cp go.sum "$reference/go.sum"; else : > "$reference/go.sum"; fi
        restore() {
          cp "$reference/go.mod" go.mod
          if [ "$had_sum" = true ]; then cp "$reference/go.sum" go.sum; else rm -f go.sum; fi
          rm -rf "$reference"
        }
        trap restore EXIT
        go mod tidy
        changed=false
        for file in go.mod go.sum; do
          current="$file"
          [ -e "$current" ] || current=/dev/null
          if ! diff -u --label "a/$file" --label "b/$file" "$reference/$file" "$current"; then changed=true; fi
        done
        if [ "$changed" = true ]; then
          echo '::error title=go mod tidy would change files::Run go mod tidy and commit go.mod and go.sum.'
          exit 1
        fi
        echo 'go.mod and go.sum are tidy.'
      shell: bash
    - name: Test
      id: test
      if: ${{ inputs.run-test }}
      env:
        TEST_COMMAND: ${{ inputs.test-command }}
        TEST_ARGS: ${{ inputs.test-args }}
        RUN_RACE: ${{ inputs.run-race }}
      run: |
        if [ -n "$TEST_COMMAND" ]; then
          [ -n "${TEST_COMMAND//[[:space:]]/}" ] || { echo '::error::test-command cannot contain only whitespace'; exit 1; }
          bash --noprofile --norc -eo pipefail -c "$TEST_COMMAND"
          exit 0
        fi
        python3 - <<'PY'
        import os, shlex, subprocess
        args = ['go', 'test']
        if os.environ['RUN_RACE'] == 'true': args.append('-race')
        args += shlex.split(os.environ['TEST_ARGS']) + ['./...']
        subprocess.run(args, check=True)
        PY
      shell: bash
    - name: Vet
      id: vet
      if: ${{ inputs.run-vet }}
      run: |
        go vet ./...
      shell: bash
    - name: Check formatting (gofmt)
      id: fmt
      if: ${{ inputs.run-fmt }}
      run: |
        unformatted="$(gofmt -l .)"
        [ -z "$unformatted" ] || { printf "%s\n" "$unformatted"; exit 1; }
      shell: bash
    - name: Enforce coverage threshold
      id: coverage-threshold
      if: ${{ inputs.coverage-threshold != 0 }}
      env:
        THRESHOLD: ${{ inputs.coverage-threshold }}
        COVERAGE_PATH: ${{ inputs.coverage-path }}
      run: |
        fail() { echo "::error title=Coverage below threshold::$1"; exit 1; }
        profile="$(printf '%s' "$COVERAGE_PATH" | tr -d '[:space:]')"
        [ -s "$profile" ] || fail "Go coverage profile $profile is missing or empty; make test-args or test-command write it (for example -coverprofile=$profile)."
        total="$(go tool cover -func="$profile" | awk '/^total:/ { gsub(/%/, "", $NF); print $NF }')"
        [[ "$total" =~ ^[0-9]+(\.[0-9]+)?$ ]] || fail "Could not read the total coverage from $profile."
        echo "Total coverage: ${total}% (threshold ${THRESHOLD}%)"
        printf '### Coverage threshold\n\n- total: %s%%\n- threshold: %s%%\n' "$total" "$THRESHOLD" >> "$GITHUB_STEP_SUMMARY"
        if awk -v c="$total" -v t="$THRESHOLD" 'BEGIN { exit !(c + 0 < t + 0) }'; then
          fail "Coverage ${total}% is below threshold ${THRESHOLD}%"
        fi
        echo "Coverage threshold met."
      shell: bash
    - name: Upload coverage artifact
      id: coverage
      if: ${{ always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') && inputs.coverage-path
        != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.coverage-artifact-name }}
        path: ${{ steps.paths.outputs.coverage }}
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}
    - name: Upload failure diagnostics
      if: ${{ failure() && inputs.failure-artifact-path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.failure-artifact-name }}
        path: ${{ steps.paths.outputs.failure }}
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention-days }}
    - name: Save Go module cache
      if: ${{ success() && inputs.cache && inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-module-cache.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.module_cache }}
        key: ${{ steps.go-module-cache.outputs.cache-primary-key }}
    - name: Save Go build cache
      if: ${{ success() && inputs.cache && inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-build-cache.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.build_cache }}
        key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Go CI
        FIELD_0: ${{ steps.build.outcome }}
        FIELD_1: ${{ steps.test.outcome }}
        FIELD_2: ${{ steps.vet.outcome }}
        FIELD_3: ${{ steps.fmt.outcome }}
        FIELD_4: ${{ steps.coverage.outcome }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- build: %s\n" "$FIELD_0"
          printf -- "- test: %s\n" "$FIELD_1"
          printf -- "- vet: %s\n" "$FIELD_2"
          printf -- "- fmt: %s\n" "$FIELD_3"
          printf -- "- coverage: %s\n" "$FIELD_4"
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: .
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
