name: Go CI
'on':
  workflow_call:
    inputs:
      go-version-file:
        description: Module file relative to repository root; empty resolves working-directory/go.mod
        required: false
        default: ''
        type: string
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      working-directory:
        description: Directory to run commands in
        required: false
        default: .
        type: string
      run-test:
        description: Run tests
        required: false
        default: true
        type: boolean
      run-race:
        description: Run tests with -race
        required: false
        default: false
        type: boolean
      run-vet:
        description: Run go vet
        required: false
        default: true
        type: boolean
      run-fmt:
        description: Check formatting with gofmt
        required: false
        default: false
        type: boolean
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 15
        type: number
      test-args:
        description: Extra args passed to go test
        required: false
        default: ''
        type: string
      test-command:
        description: Custom command to run instead of the default go test invocation; bypasses test-args and run-race
        required: false
        default: ''
        type: string
      build-command:
        description: Optional build command to run before tests
        required: false
        default: ''
        type: string
      coverage-path:
        description: Optional coverage file path relative to working-directory to upload as an artifact
        required: false
        default: ''
        type: string
      coverage-artifact-name:
        description: Artifact name for uploaded coverage output
        required: false
        default: ''
        type: string
      artifact-retention-days:
        description: Coverage/diagnostic retention
        type: number
        required: false
        default: 7
      failure-artifact-path:
        description: Optional diagnostics relative to working-directory
        type: string
        required: false
        default: ''
      failure-artifact-name:
        description: Unique failure artifact name
        type: string
        required: false
        default: go-diagnostics
      cache:
        description: Restore dependency/build/tool caches; disable for private dependencies
        type: boolean
        required: false
        default: true
      save-cache:
        description: Save Go caches on a successful trusted default-branch run; designate one writer per pipeline
        type: boolean
        required: false
        default: false
jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Resolve artifact paths
      id: paths
      env:
        COVERAGE_PATHS: ${{ inputs.coverage-path }}
        FAILURE_PATHS: ${{ inputs.failure-artifact-path }}
      run: |
        python3 - <<'PY'
        import os, pathlib, uuid
        root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
        cwd = pathlib.Path.cwd().resolve()
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            for name, variable in [('coverage', 'COVERAGE_PATHS'), ('failure', 'FAILURE_PATHS')]:
                paths = []
                for line in os.environ[variable].splitlines():
                    if not line.strip(): continue
                    negative = line.startswith('!')
                    path = (cwd / (line[1:] if negative else line)).resolve()
                    path.relative_to(root)
                    if path == root: raise SystemExit('Artifact paths must select a child of the repository')
                    paths.append(('!' if negative else '') + str(path))
                delimiter = 'PATHS_' + uuid.uuid4().hex
                out.write(name + '<<' + delimiter + '\n' + '\n'.join(paths) + '\n' + delimiter + '\n')
        PY
      shell: bash
    - name: Require a Go check
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
        RUN_TEST: ${{ inputs.run-test }}
        RUN_VET: ${{ inputs.run-vet }}
        RUN_FMT: ${{ inputs.run-fmt }}
      run: |
        if [ -z "${BUILD_COMMAND//[[:space:]]/}" ] && [ "$RUN_TEST" != true ] && [ "$RUN_VET" != true ] && [ "$RUN_FMT" != true ]; then
          echo '::error::Enable at least one build/test/vet/format check'; exit 1
        fi
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: ${{ inputs.go-version-file != '' && inputs.go-version-file || format('{0}/go.mod', inputs.working-directory)
          }}
        cache: false
    - name: Detect Go cache metadata
      id: go-cache-metadata
      shell: bash
      run: |
        {
          echo "version=$(go env GOVERSION)"
          echo "module_cache=$(go env GOMODCACHE)"
          echo "build_cache=$(go env GOCACHE)"
        } >> "$GITHUB_OUTPUT"
        printf "scope=%s\n" "$(printf %s "$MODULE_DIR" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      working-directory: ${{ inputs.working-directory }}
      env:
        MODULE_DIR: ${{ inputs.working-directory }}
    - name: Restore Go module cache
      if: ${{ inputs.cache && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.module_cache }}
        key: go-mod-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version
          }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory), format('{0}/go.sum', inputs.working-directory))
          }}
        restore-keys: |
          go-mod-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version }}-
      id: go-module-cache
    - name: Restore Go build cache
      if: ${{ inputs.cache && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.build_cache }}
        key: go-build-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version
          }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory), format('{0}/go.sum', inputs.working-directory))
          }}-${{ github.sha }}
        restore-keys: |
          go-build-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory), format('{0}/go.sum', inputs.working-directory)) }}-
      id: go-build-cache
    - name: Validate test inputs
      if: ${{ inputs.run-test && inputs.test-command != '' && (inputs.run-race || inputs.test-args != '') }}
      run: |
        echo "::error title=Invalid Go CI inputs::test-command bypasses run-race and test-args. Include any race or extra test flags directly in test-command, or unset test-command to use the default test runner."
        exit 1
      shell: bash
    - name: Validate coverage inputs
      if: ${{ (inputs.coverage-path == '' && inputs.coverage-artifact-name != '') || (inputs.coverage-path != ''
        && inputs.coverage-artifact-name == '') || (inputs.coverage-path != '' && !inputs.run-test) }}
      run: |
        echo "::error title=Invalid Go CI inputs::coverage-path and coverage-artifact-name must be set together to upload coverage artifacts."
        exit 1
      shell: bash
    - name: Build
      id: build
      if: ${{ inputs.build-command != '' }}
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: |
        bash --noprofile --norc -eo pipefail -c "$BUILD_COMMAND"
      shell: bash
    - name: Test
      id: test
      if: ${{ inputs.run-test }}
      env:
        TEST_COMMAND: ${{ inputs.test-command }}
        TEST_ARGS: ${{ inputs.test-args }}
        RUN_RACE: ${{ inputs.run-race }}
      run: |
        if [ -n "$TEST_COMMAND" ]; then
          [ -n "${TEST_COMMAND//[[:space:]]/}" ] || { echo '::error::test-command cannot contain only whitespace'; exit 1; }
          bash --noprofile --norc -eo pipefail -c "$TEST_COMMAND"
          exit 0
        fi
        python3 - <<'PY'
        import os, shlex, subprocess
        args = ['go', 'test']
        if os.environ['RUN_RACE'] == 'true': args.append('-race')
        args += shlex.split(os.environ['TEST_ARGS']) + ['./...']
        subprocess.run(args, check=True)
        PY
      shell: bash
    - name: Vet
      id: vet
      if: ${{ inputs.run-vet }}
      run: |
        go vet ./...
      shell: bash
    - name: Check formatting (gofmt)
      id: fmt
      if: ${{ inputs.run-fmt }}
      run: |
        unformatted="$(gofmt -l .)"
        [ -z "$unformatted" ] || { printf "%s\n" "$unformatted"; exit 1; }
      shell: bash
    - name: Upload coverage artifact
      id: coverage
      if: ${{ always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') && inputs.coverage-path
        != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.coverage-artifact-name }}
        path: ${{ steps.paths.outputs.coverage }}
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}
    - name: Upload failure diagnostics
      if: ${{ failure() && inputs.failure-artifact-path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.failure-artifact-name }}
        path: ${{ steps.paths.outputs.failure }}
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention-days }}
    - name: Save Go module cache
      if: ${{ success() && inputs.cache && inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-module-cache.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.module_cache }}
        key: ${{ steps.go-module-cache.outputs.cache-primary-key }}
    - name: Save Go build cache
      if: ${{ success() && inputs.cache && inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-build-cache.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.build_cache }}
        key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Go CI
        FIELD_0: ${{ steps.build.outcome }}
        FIELD_1: ${{ steps.test.outcome }}
        FIELD_2: ${{ steps.vet.outcome }}
        FIELD_3: ${{ steps.fmt.outcome }}
        FIELD_4: ${{ steps.coverage.outcome }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- build: %s\n" "$FIELD_0"
          printf -- "- test: %s\n" "$FIELD_1"
          printf -- "- vet: %s\n" "$FIELD_2"
          printf -- "- fmt: %s\n" "$FIELD_3"
          printf -- "- coverage: %s\n" "$FIELD_4"
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: .
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
