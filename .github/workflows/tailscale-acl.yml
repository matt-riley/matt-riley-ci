name: Tailscale ACL
'on':
  workflow_call:
    inputs:
      tailnet:
        description: Tailnet name, or '-' for the default tailnet of the credential
        required: false
        default: '-'
        type: string
      oauth-client-id:
        description: Tailscale federated identity client ID (not a secret)
        required: true
        type: string
      audience:
        description: Audience the federated identity expects, e.g. api.tailscale.com/<client id> (not a secret)
        required: true
        type: string
      policy-file:
        description: Path to the HuJSON policy file, relative to the repository root
        required: false
        default: policy.hujson
        type: string
      action:
        description: '''test'', ''apply'', or '''' to test on pull requests and apply on pushes to the default branch'
        required: false
        default: ''
        type: string
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 10
        type: number
      environment:
        description: Optional protected environment for ACL changes
        type: string
        required: false
        default: ''
jobs:
  acl:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Resolve action
      id: resolve
      env:
        REQUESTED: ${{ inputs.action }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        POLICY_FILE: ${{ inputs.policy-file }}
      run: |
        set -euo pipefail

        case "$REQUESTED" in
          test|apply)
            resolved="$REQUESTED"
            ;;
          "")
            # Applying only from the default branch keeps a merge the single
            # way the tailnet changes. Everything else validates and stops.
            if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              resolved="apply"
            else
              resolved="test"
            fi
            ;;
          *)
            echo "::error title=Invalid action::action must be 'test', 'apply', or '' for automatic selection, got '$REQUESTED'." >&2
            exit 1
            ;;
        esac

        if [ "$resolved" = apply ] && { { [ "$EVENT_NAME" != push ] && [ "$EVENT_NAME" != workflow_dispatch ]; } || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; }; then
          echo '::error::Applying ACLs requires a trusted default-branch push or manual run'; exit 1
        fi
        if [ ! -f "$POLICY_FILE" ]; then
          echo "::error title=Policy file not found::'$POLICY_FILE' does not exist in this repository. Set the policy-file input to its path." >&2
          exit 1
        fi

        echo "action=$resolved" >> "$GITHUB_OUTPUT"
        echo "Resolved action: $resolved (policy file: $POLICY_FILE)"
      shell: bash
    - name: Run Tailscale ACL ${{ steps.resolve.outputs.action }}
      uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a
      with:
        oauth-client-id: ${{ inputs.oauth-client-id }}
        audience: ${{ inputs.audience }}
        tailnet: ${{ inputs.tailnet }}
        policy-file: ${{ inputs.policy-file }}
        action: ${{ steps.resolve.outputs.action }}
      id: acl
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Tailscale ACL
        FIELD_0: ${{ steps.resolve.outputs.action }}
        FIELD_1: ${{ steps.acl.outcome }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- Action: %s\n" "$FIELD_0"
          printf -- "- Outcome: %s\n" "$FIELD_1"
        } >> "$GITHUB_STEP_SUMMARY"
    environment: ${{ inputs.environment }}
    concurrency:
      group: tailscale-acl:${{ github.repository }}:${{ inputs.tailnet }}:${{ (inputs.action == 'apply' || (inputs.action == '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'apply' || 'test' }}
      cancel-in-progress: false
