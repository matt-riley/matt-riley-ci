name: Go Lint

on:
  workflow_call:
    inputs:
      go-version-file:
        description: 'Path to go.mod'
        required: false
        default: 'go.mod'
        type: string
      runner:
        description: 'Runner label'
        required: false
        default: 'ubuntu-latest'
        type: string
      working-directory:
        description: 'Directory to run commands in'
        required: false
        default: '.'
        type: string
      golangci-version:
        description: 'golangci-lint version'
        required: false
        default: 'v2.10.1'
        type: string
      golangci-args:
        description: 'Additional golangci-lint args'
        required: false
        default: '--timeout=5m'
        type: string
      continue-on-error:
        description: 'Continue if golangci-lint reports issues'
        required: false
        default: false
        type: boolean
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        default: 15
        type: number
      cancel-in-progress:
        description: 'Cancel previous in-progress runs for same ref'
        required: false
        default: false
        type: boolean
      concurrency-suffix:
        description: 'Optional suffix to distinguish concurrency groups when this reusable workflow is called multiple times in one workflow'
        required: false
        default: ''
        type: string

jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: ${{ inputs.concurrency-suffix != '' && format('{0}:{1}:{2}:{3}', github.workflow, github.repository, github.ref, inputs.concurrency-suffix) || format('{0}:{1}:{2}', github.workflow, github.repository, github.ref) }}
      cancel-in-progress: ${{ inputs.cancel-in-progress }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Detect Go cache metadata
        id: go-cache-metadata
        shell: bash
        run: |
          {
            echo "version=$(go env GOVERSION)"
            echo "module_cache=$(go env GOMODCACHE)"
            echo "build_cache=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.go-cache-metadata.outputs.module_cache }}
          key: go-mod-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-mod-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.version }}-

      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.go-cache-metadata.outputs.build_cache }}
          key: go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ inputs.golangci-version }}
          args: ${{ inputs.golangci-args }}
          working-directory: ${{ inputs.working-directory }}
          skip-save-cache: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        continue-on-error: ${{ inputs.continue-on-error }}

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Go Lint summary"
            echo "- runner: \`${{ inputs.runner }}\`"
            echo "- working-directory: \`${{ inputs.working-directory }}\`"
            echo "- golangci-version: \`${{ inputs.golangci-version }}\`"
            echo "- golangci-args: \`${{ inputs.golangci-args }}\`"
            echo "- continue-on-error: \`${{ inputs.continue-on-error }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
