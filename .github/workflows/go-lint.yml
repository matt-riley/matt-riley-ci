name: Go Lint
'on':
  workflow_call:
    inputs:
      go-version-file:
        description: Module file relative to repository root; empty resolves working-directory/go.mod
        required: false
        default: ''
        type: string
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      working-directory:
        description: Directory to run commands in
        required: false
        default: .
        type: string
      golangci-version:
        description: golangci-lint version
        required: false
        default: v2.13.2
        type: string
      golangci-args:
        description: Additional golangci-lint args
        required: false
        default: --timeout=5m
        type: string
      continue-on-error:
        description: Continue if golangci-lint reports issues
        required: false
        default: false
        type: boolean
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 15
        type: number
      save-cache:
        description: Save Go caches on a successful trusted default-branch run; designate one writer per pipeline
        type: boolean
        required: false
        default: false
jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: ${{ inputs.go-version-file != '' && inputs.go-version-file || format('{0}/go.mod', inputs.working-directory)
          }}
        cache: false
    - name: Detect Go cache metadata
      id: go-cache-metadata
      shell: bash
      run: |
        {
          echo "version=$(go env GOVERSION)"
          echo "module_cache=$(go env GOMODCACHE)"
          echo "build_cache=$(go env GOCACHE)"
        } >> "$GITHUB_OUTPUT"
        printf "scope=%s\n" "$(printf %s "$MODULE_DIR" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      working-directory: ${{ inputs.working-directory }}
      env:
        MODULE_DIR: ${{ inputs.working-directory }}
    - name: Restore Go module cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.module_cache }}
        key: go-mod-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version
          }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory), format('{0}/go.sum', inputs.working-directory))
          }}
        restore-keys: |
          go-mod-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version }}-
      id: go-module-cache
    - name: Restore Go build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.build_cache }}
        key: go-build-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version
          }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory), format('{0}/go.sum', inputs.working-directory))
          }}-${{ github.sha }}
        restore-keys: |
          go-build-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-metadata.outputs.scope }}-${{ steps.go-cache-metadata.outputs.version }}-${{ hashFiles(format('{0}/go.mod', inputs.working-directory), format('{0}/go.sum', inputs.working-directory)) }}-
      id: go-build-cache
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        version: ${{ inputs.golangci-version }}
        args: ${{ inputs.golangci-args }}
        working-directory: ${{ inputs.working-directory }}
        skip-save-cache: ${{ !(inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      continue-on-error: ${{ inputs.continue-on-error }}
      id: lint
    - name: Save Go module cache
      if: ${{ success() && inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-module-cache.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.module_cache }}
        key: ${{ steps.go-module-cache.outputs.cache-primary-key }}
    - name: Save Go build cache
      if: ${{ success() && inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-build-cache.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.go-cache-metadata.outputs.build_cache }}
        key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Go lint
        FIELD_0: ${{ steps.lint.outcome }}
        FIELD_1: ${{ inputs.continue-on-error }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- Lint outcome: %s\n" "$FIELD_0"
          printf -- "- Allowed failure: %s\n" "$FIELD_1"
        } >> "$GITHUB_STEP_SUMMARY"
