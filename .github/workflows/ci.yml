name: Universal CI
'on':
  workflow_call:
    inputs:
      install:
        description: Run the mise install task
        required: false
        default: false
        type: boolean
      lint:
        description: Run the mise lint task
        required: false
        default: false
        type: boolean
      build:
        description: Run the mise build task
        required: false
        default: false
        type: boolean
      test:
        description: Run the mise test task
        required: false
        default: false
        type: boolean
      vet:
        description: Run the mise vet task
        required: false
        default: false
        type: boolean
      fmt:
        description: Run the mise fmt task
        required: false
        default: false
        type: boolean
      save-cache:
        description: Save dependency and build caches after a successful run
        required: false
        default: false
        type: boolean
      task-prefix:
        description: Optional prefix added before standard task names (for example "go-" -> "go-test")
        required: false
        default: ''
        type: string
      task-env:
        description: Optional multiline KEY=VALUE entries exported before running mise tasks
        required: false
        default: ''
        type: string
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 15
        type: number
      working-directory:
        description: Repository directory containing mise configuration and tasks; all task and cache discovery
          uses this directory
        required: false
        default: .
        type: string
      task:
        description: Task to run when no phase flags are enabled; empty is invalid
        type: string
        required: false
        default: ci
      cache:
        description: Restore dependency caches
        type: boolean
        required: false
        default: true
      cache-paths:
        description: Optional additional cache paths, one per line
        type: string
        required: false
        default: ''
      cache-dependency-path:
        description: Optional dependency-file glob, relative to repository root, included in cache identity
        type: string
        required: false
        default: ''
      artifact-path:
        description: Build output paths relative to working-directory; requires artifact-name
        type: string
        required: false
        default: ''
      artifact-name:
        description: Name of the successful build artifact; requires artifact-path
        type: string
        required: false
        default: ''
      artifact-retention-days:
        description: Artifact retention in days
        type: number
        required: false
        default: 7
      failure-artifact-path:
        description: Optional diagnostic paths to upload when tasks fail, relative to working-directory
        type: string
        required: false
        default: ''
      failure-artifact-name:
        description: Unique name for failure diagnostics
        type: string
        required: false
        default: ci-diagnostics
      mise-version:
        description: Pinned mise release
        type: string
        required: false
        default: 2026.9.18
      install-tools:
        description: Optional mise install arguments, e.g. node pnpm; empty installs tools declared by the consumer
        type: string
        required: false
        default: ''
      task-jobs:
        description: Maximum parallel tasks; dependencies/order are owned by the repository task graph
        type: number
        required: false
        default: 1
      playwright-cache:
        description: Restore browser binaries only in jobs that run browser tests; OS libraries remain the task/runner
          responsibility
        type: boolean
        required: false
        default: false
    secrets:
      registry-token:
        description: Optional private package registry credential exposed only to tasks as NODE_AUTH_TOKEN
        required: false
      dependency-token:
        description: Optional read-only GitHub token for private modules; exposed only to tasks as DEPENDENCY_TOKEN
        required: false
    outputs:
      artifact_id:
        description: Uploaded artifact ID
        value: ${{ jobs.ci.outputs.artifact_id }}
      artifact_digest:
        description: SHA-256 digest of uploaded artifact
        value: ${{ jobs.ci.outputs.artifact_digest }}
      artifact_url:
        description: Uploaded artifact URL
        value: ${{ jobs.ci.outputs.artifact_url }}
      task_outcome:
        description: Actual task execution outcome
        value: ${{ jobs.ci.outputs.task_outcome }}
jobs:
  ci:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      MISE_EXPERIMENTAL: true
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Validate CI inputs
      env:
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        RETENTION: ${{ inputs.artifact-retention-days }}
      run: |
        if { [ -n "$ARTIFACT_PATH" ] && [ -z "$ARTIFACT_NAME" ]; } || { [ -z "$ARTIFACT_PATH" ] && [ -n "$ARTIFACT_NAME" ]; }; then
          echo '::error::artifact-path and artifact-name must be supplied together'; exit 1
        fi
        [[ "$RETENTION" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Artifact retention must be a positive integer'; exit 1; }
      shell: bash
    - name: Resolve artifact paths
      id: paths
      env:
        BUILD_PATHS: ${{ inputs.artifact-path }}
        FAILURE_PATHS: ${{ inputs.failure-artifact-path }}
      run: |
        python3 - <<'PY'
        import os, pathlib, uuid
        root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
        cwd = pathlib.Path.cwd().resolve()
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            for name, variable in [('build', 'BUILD_PATHS'), ('failure', 'FAILURE_PATHS')]:
                paths = []
                for line in os.environ[variable].splitlines():
                    if not line.strip(): continue
                    negative = line.startswith('!')
                    path = (cwd / (line[1:] if negative else line)).resolve()
                    path.relative_to(root)
                    paths.append(('!' if negative else '') + str(path))
                delimiter = 'PATHS_' + uuid.uuid4().hex
                out.write(name + '<<' + delimiter + '\n' + '\n'.join(paths) + '\n' + delimiter + '\n')
        PY
      shell: bash
    - name: Install mise
      uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
      with:
        working_directory: ${{ inputs.working-directory }}
        cache_save: ${{ inputs.save-cache && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        version: ${{ inputs.mise-version }}
        install_args: ${{ inputs.install-tools }}
        add_shims_to_path: false
    - name: Expose installed tool binaries
      shell: bash
      run: |
        mise bin-paths > "$RUNNER_TEMP/mise-bin-paths"
        while IFS= read -r directory; do
          if [ -d "$directory" ]; then printf '%s\n' "$directory" >> "$GITHUB_PATH"; fi
        done < "$RUNNER_TEMP/mise-bin-paths"
    - name: Detect cache metadata
      id: cache-metadata
      if: ${{ inputs.cache }}
      env:
        EXTRA_PATHS: ${{ inputs.cache-paths }}
        PLAYWRIGHT_CACHE: ${{ inputs.playwright-cache }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib, json, os, pathlib, shutil, subprocess
        def command(*args):
            return subprocess.check_output(args, text=True).strip()
        dependency_paths = []
        versions = []
        if pathlib.Path('pnpm-lock.yaml').is_file():
            dependency_paths.append(command('pnpm', 'store', 'path', '--silent'))
            versions.append('pnpm=' + command('pnpm', '--version'))
        elif pathlib.Path('package-lock.json').is_file() or pathlib.Path('npm-shrinkwrap.json').is_file():
            dependency_paths.append(command('npm', 'config', 'get', 'cache'))
            versions.append('node=' + command('node', '--version'))
        elif pathlib.Path('yarn.lock').is_file():
            versions.append('yarn=' + command('yarn', '--version'))
            try:
                yarn_cache = command('yarn', 'config', 'get', 'cacheFolder')
                if yarn_cache == 'undefined': raise ValueError('classic yarn')
            except (ValueError, subprocess.CalledProcessError):
                yarn_cache = command('yarn', 'cache', 'dir')
            dependency_paths.append(yarn_cache)
        elif pathlib.Path('bun.lock').is_file() or pathlib.Path('bun.lockb').is_file():
            dependency_paths.append(str(pathlib.Path.home() / '.bun/install/cache'))
            versions.append('bun=' + command('bun', '--version'))
        build_cache = ''
        if pathlib.Path('go.mod').is_file():
            dependency_paths.append(command('go', 'env', 'GOMODCACHE'))
            build_cache = command('go', 'env', 'GOCACHE')
            versions.append('go=' + command('go', 'env', 'GOVERSION'))
        if os.environ['PLAYWRIGHT_CACHE'] == 'true':
            for location in ('.cache/ms-playwright', 'Library/Caches/ms-playwright'):
                dependency_paths.append(str(pathlib.Path.home() / location))
        dependency_paths += os.environ['EXTRA_PATHS'].splitlines()
        dependency_paths = [p for p in dict.fromkeys(dependency_paths) if p]
        scope = hashlib.sha256(str(pathlib.Path.cwd().relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve())).encode()).hexdigest()[:16]
        tools = hashlib.sha256('\n'.join(versions).encode()).hexdigest()[:16]
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write('paths<<CACHE_PATHS\n' + '\n'.join(dependency_paths) + '\nCACHE_PATHS\n')
            out.write(f'build_cache={build_cache}\nscope={scope}\ntools={tools}\n')
        PY
      shell: bash
    - name: Restore dependencies
      id: dependencies
      if: ${{ inputs.cache && steps.cache-metadata.outputs.paths != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.cache-metadata.outputs.paths }}
        key: deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-metadata.outputs.scope }}-${{ steps.cache-metadata.outputs.tools
          }}-${{ hashFiles(format('{0}/**/go.mod', inputs.working-directory), format('{0}/**/go.sum', inputs.working-directory),
          format('{0}/**/*lock*', inputs.working-directory), format('{0}/mise.toml', inputs.working-directory),
          format('{0}/.tool-versions', inputs.working-directory), inputs.cache-dependency-path) }}
        restore-keys: deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-metadata.outputs.scope }}-${{
          steps.cache-metadata.outputs.tools }}-
    - name: Restore Go build cache
      id: go-build-cache
      if: ${{ inputs.cache && steps.cache-metadata.outputs.build_cache != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.cache-metadata.outputs.build_cache }}
        key: deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-metadata.outputs.scope }}-${{ steps.cache-metadata.outputs.tools
          }}-build-${{ hashFiles(format('{0}/**/go.mod', inputs.working-directory), format('{0}/**/go.sum', inputs.working-directory),
          format('{0}/**/*lock*', inputs.working-directory), format('{0}/mise.toml', inputs.working-directory),
          format('{0}/.tool-versions', inputs.working-directory), inputs.cache-dependency-path) }}-${{ github.sha
          }}
        restore-keys: deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-metadata.outputs.scope }}-${{
          steps.cache-metadata.outputs.tools }}-build-${{ hashFiles(format('{0}/**/go.mod', inputs.working-directory),
          format('{0}/**/go.sum', inputs.working-directory), format('{0}/**/*lock*', inputs.working-directory),
          format('{0}/mise.toml', inputs.working-directory), format('{0}/.tool-versions', inputs.working-directory),
          inputs.cache-dependency-path) }}-
    - name: Run repository tasks
      id: tasks
      env:
        DEFAULT_TASK: ${{ inputs.task }}
        TASK_PREFIX: ${{ inputs.task-prefix }}
        TASK_ENV: ${{ inputs.task-env }}
        PHASE_INSTALL: ${{ inputs.install }}
        PHASE_LINT: ${{ inputs.lint }}
        PHASE_BUILD: ${{ inputs.build }}
        PHASE_TEST: ${{ inputs.test }}
        PHASE_VET: ${{ inputs.vet }}
        PHASE_FMT: ${{ inputs.fmt }}
        NODE_AUTH_TOKEN: ${{ secrets.registry-token }}
        DEPENDENCY_TOKEN: ${{ secrets.dependency-token }}
        TASK_JOBS: ${{ inputs.task-jobs }}
      run: |
        set -euo pipefail
        while IFS= read -r line || [ -n "$line" ]; do
          [ -z "$line" ] && continue
          [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]] || { echo '::error::task-env must contain KEY=VALUE entries'; exit 1; }
          key="${line%%=*}"
          case "$key" in GITHUB_*|RUNNER_*|ACTIONS_*|NODE_AUTH_TOKEN|DEPENDENCY_TOKEN|PHASE_*|DEFAULT_TASK|TASK_PREFIX|TASK_ENV|TASK_JOBS|PATH|BASH_ENV|ENV)
            echo '::error::task-env cannot override workflow control variables'; exit 1;;
          esac
          export "${line?}"
        done <<< "$TASK_ENV"
        tasks=()
        for phase in install lint build test vet fmt; do
          flag="PHASE_$(printf %s "$phase" | tr '[:lower:]' '[:upper:]')"
          if [ "${!flag}" = true ]; then tasks+=("$TASK_PREFIX$phase"); fi
        done
        if [ "${#tasks[@]}" -eq 0 ]; then
          [ -n "$DEFAULT_TASK" ] || { echo '::error::A task or at least one phase is required'; exit 1; }
          tasks=("$TASK_PREFIX$DEFAULT_TASK")
        fi
        for task in "${tasks[@]}"; do
          [[ "$task" =~ ^[A-Za-z0-9_][A-Za-z0-9_.:-]*$ ]] || { echo '::error::Invalid task name'; exit 1; }
        done
        # One process shares the dependency graph: install/build dependencies execute once.
        invocations=()
        for task in "${tasks[@]}"; do
          if [ "${#invocations[@]}" -gt 0 ]; then invocations+=(:::); fi
          invocations+=("$task")
        done
        [[ "$TASK_JOBS" =~ ^[1-9][0-9]*$ ]] || { echo '::error::task-jobs must be positive'; exit 1; }
        mise run --skip-tools --jobs "$TASK_JOBS" "${invocations[@]}"
      shell: bash
    - name: Save dependencies
      if: ${{ success() && inputs.cache && inputs.save-cache && (github.event_name == 'push' || github.event_name
        == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        && steps.dependencies.outputs.cache-primary-key != '' && steps.dependencies.outputs.cache-hit != 'true'
        }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.cache-metadata.outputs.paths }}
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
    - name: Save Go build cache
      if: ${{ success() && inputs.cache && inputs.save-cache && (github.event_name == 'push' || github.event_name
        == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        && steps.go-build-cache.outputs.cache-primary-key != '' && steps.go-build-cache.outputs.cache-hit != 'true'
        }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.cache-metadata.outputs.build_cache }}
        key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
    - name: Upload build artifact
      id: artifact
      if: ${{ inputs.artifact-path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.paths.outputs.build }}
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}
    - name: Upload failure diagnostics
      if: ${{ failure() && inputs.failure-artifact-path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.failure-artifact-name }}
        path: ${{ steps.paths.outputs.failure }}
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention-days }}
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: Universal CI
        FIELD_0: ${{ steps.tasks.outcome }}
        FIELD_1: ${{ steps.artifact.outcome }}
        FIELD_2: ${{ steps.dependencies.outputs.cache-matched-key }}
        FIELD_3: ${{ steps.go-build-cache.outputs.cache-matched-key }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- Tasks: %s\n" "$FIELD_0"
          printf -- "- Build artifact: %s\n" "$FIELD_1"
          printf -- "- Dependency cache: %s\n" "$FIELD_2"
          printf -- "- Go build cache: %s\n" "$FIELD_3"
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: .
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      artifact_url: ${{ steps.artifact.outputs.artifact-url }}
      task_outcome: ${{ steps.tasks.outcome }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
