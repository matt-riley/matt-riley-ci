name: Request application deployment

"on":
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      production-branch:
        default: main
        type: string
      dispatch-app-id:
        required: true
        type: string
      artifact-run-id:
        default: ''
        type: string
      artifact-name:
        default: ''
        type: string
      artifact-digest:
        default: ''
        type: string
    secrets:
      INFRA_DISPATCH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  request:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.production-branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint dispatch-only token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ inputs.dispatch-app-id }}
          private-key: ${{ secrets.INFRA_DISPATCH_PRIVATE_KEY }}
          owner: matt-riley
          repositories: infra
          permission-contents: write
      - name: Request exact source revision
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP: ${{ inputs.app }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ inputs.artifact-run-id }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$APP" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ -n "$RUN_ID$ARTIFACT_NAME$ARTIFACT_DIGEST" ]]; then
            [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && -n "$ARTIFACT_NAME" && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          fi
          jq -n \
            --arg app "$APP" --arg repo "$SOURCE_REPO" --arg sha "$SOURCE_SHA" --arg ref "$SOURCE_REF" \
            --arg run "$RUN_ID" --arg name "$ARTIFACT_NAME" --arg digest "$ARTIFACT_DIGEST" \
            '{event_type:"deploy-app",client_payload:({app:$app,app_id:$app,source_repo:$repo,source_sha:$sha,ref:$ref} +
              (if $run == "" then {} else {artifact_run_id:$run,artifact_name:$name,artifact_digest:$digest} end))}' |
            gh api --method POST repos/matt-riley/infra/dispatches --input -
