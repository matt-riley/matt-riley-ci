name: PNPM Lockfile Sync
'on':
  workflow_call:
    inputs:
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
      working-directory:
        description: Directory containing package.json and lockfile
        required: false
        default: .
        type: string
      node-version:
        description: Node version
        required: false
        default: '24'
        type: string
      pnpm-version:
        description: Optional override; otherwise packageManager in working-directory/package.json selects pnpm
        required: false
        default: ''
        type: string
      lockfile-name:
        description: Lockfile name to update and commit
        required: false
        default: pnpm-lock.yaml
        type: string
      install-command:
        description: Command used to refresh the lockfile
        required: false
        default: pnpm install --no-frozen-lockfile --lockfile-only --ignore-scripts
        type: string
      commit-message:
        description: Commit message for lockfile updates
        required: false
        default: 'chore: sync pnpm lockfile'
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        default: 15
        type: number
      release-branch-prefix:
        description: Only sync same-repository release PR branches starting with this prefix
        type: string
        required: false
        default: release-please--
    secrets:
      token:
        description: Token with contents:write to push branch updates
        required: true
jobs:
  sync-lockfile:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, inputs.release-branch-prefix) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    steps:
    - name: Checkout branch
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        ref: ${{ github.head_ref }}
        persist-credentials: false
    - name: Validate sync inputs
      env:
        PREFIX: ${{ inputs.release-branch-prefix }}
        LOCKFILE: ${{ inputs.lockfile-name }}
        PNPM_VERSION: ${{ inputs.pnpm-version }}
        PACKAGE_JSON: ${{ format('{0}/package.json', inputs.working-directory) }}
      shell: bash
      run: |
        test -n "$PREFIX" || { echo '::error::release-branch-prefix must not be empty'; exit 1; }
        [[ "$LOCKFILE" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo '::error::lockfile-name must be a filename'; exit 1; }
        [[ "$LOCKFILE" != . && "$LOCKFILE" != .. ]] || { echo '::error::lockfile-name cannot be a directory'; exit 1; }
        python3 - <<'PY'
        import json, os, pathlib
        if not os.environ['PNPM_VERSION']:
            package = json.loads(pathlib.Path(os.environ['PACKAGE_JSON']).read_text())
            if not package.get('packageManager', '').startswith('pnpm@'):
                raise SystemExit('Set pnpm-version or declare packageManager: pnpm@<version> in package.json')
        PY
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      with:
        version: ${{ inputs.pnpm-version }}
        package_json_file: ${{ format('{0}/package.json', inputs.working-directory) }}
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ format('{0}/{1}', inputs.working-directory, inputs.lockfile-name) }}
    - name: Update lockfile
      run: |
        bash --noprofile --norc -eo pipefail -c "$INSTALL_COMMAND"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
    - name: Commit and push lockfile changes
      working-directory: ${{ inputs.working-directory }}
      env:
        HEAD_REF: ${{ github.head_ref }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        LOCKFILE: ${{ inputs.lockfile-name }}
        PUSH_TOKEN: ${{ secrets.token }}
      run: |
        # shellcheck disable=SC2016
        # The helper expands PUSH_TOKEN only when git invokes it.
        [[ "$LOCKFILE" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo '::error::lockfile-name must be a filename'; exit 1; }
        [[ "$LOCKFILE" != . && "$LOCKFILE" != .. && -f "$LOCKFILE" && ! -L "$LOCKFILE" ]] || { echo '::error::lockfile-name must identify a regular file'; exit 1; }
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -- "$LOCKFILE"
        if git diff --cached --quiet; then echo 'status=unchanged' >> "$GITHUB_OUTPUT"; exit 0; fi
        git commit -m "$COMMIT_MESSAGE" -- "$LOCKFILE"
        PUSH_REF="HEAD:$HEAD_REF"
        # shellcheck disable=SC2016
        git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$PUSH_TOKEN"; }; f' push origin "$PUSH_REF"
        echo 'status=pushed' >> "$GITHUB_OUTPUT"
      shell: bash
      id: push
    - name: Summary
      if: ${{ always() }}
      shell: bash
      env:
        SUMMARY_TITLE: PNPM lockfile sync
        FIELD_0: ${{ steps.push.outputs.status }}
        JOB_STATUS: ${{ job.status }}
      run: |
        {
          printf "### %s\n\n" "$SUMMARY_TITLE"
          printf -- "- Job: %s\n" "$JOB_STATUS"
          printf -- "- Result: %s\n" "$FIELD_0"
        } >> "$GITHUB_STEP_SUMMARY"
    concurrency:
      group: pnpm-sync:${{ github.repository }}:${{ github.head_ref }}
      cancel-in-progress: false
