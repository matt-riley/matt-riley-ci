[tools]
python = "3.14.7"
actionlint = "1.7.12"

[tasks.setup]
description = "Install validation dependencies into a local virtual environment"
run = "python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.txt"

[tasks.validate-workflows]
description = "Run YAML policy, actionlint, zizmor, executable contracts and documentation checks"
run = ".venv/bin/python -B scripts/check.py"
env = { PATH = "{{config_root}}/.venv/bin:{{env.PATH}}" }

[tasks.ci]
depends = ["validate-workflows"]
